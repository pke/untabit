name: Update AMO release notes

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update existing AMO version metadata
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail

          VERSION=$(jq -r .version store-assets/release-metadata.json)
          MANIFEST_VERSION=$(jq -r .version manifest.firefox.json)
          [ "$VERSION" = "$MANIFEST_VERSION" ] || {
            echo "Release metadata $VERSION does not match Firefox manifest $MANIFEST_VERSION"
            exit 1
          }

          TOKEN=$(python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import time
          import uuid

          def encode(value):
              raw = json.dumps(value, separators=(",", ":")).encode()
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode()

          now = int(time.time())
          header = encode({"alg": "HS256", "typ": "JWT"})
          payload = encode({
              "iss": os.environ["AMO_JWT_ISSUER"],
              "jti": str(uuid.uuid4()),
              "iat": now,
              "exp": now + 60,
          })
          message = f"{header}.{payload}"
          signature = hmac.new(
              os.environ["AMO_JWT_SECRET"].encode(),
              message.encode(),
              hashlib.sha256,
          ).digest()
          encoded_signature = base64.urlsafe_b64encode(signature).rstrip(b"=").decode()
          print(f"{message}.{encoded_signature}")
          PY
          )

          jq '{release_notes: .release_notes, approval_notes: .approval_notes}' store-assets/release-metadata.json > /tmp/amo-version-metadata.json

          API="https://addons.mozilla.org/api/v5/addons/addon/untabit/versions/$VERSION/"
          curl -fsS -X PATCH "$API" -H "Authorization: JWT $TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/amo-version-metadata.json > /tmp/amo-response.json

          jq '{version, release_notes}' /tmp/amo-response.json
