# Publishes release tags to all extension stores automatically.
# Manual dispatch remains available for retrying all stores or one store.
#
# Required repository secrets:
#   Chrome Web Store (https://developer.chrome.com/docs/webstore/using-api):
#     CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN
#   Firefox AMO (https://addons.mozilla.org/developers/addon/api/key/):
#     AMO_JWT_ISSUER, AMO_JWT_SECRET
#   Edge Add-ons (Partner Center -> Publish API):
#     EDGE_PRODUCT_ID, EDGE_CLIENT_ID, EDGE_API_KEY
name: Publish to stores

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Store to publish to
        type: choice
        options: [all, chrome-web-store, firefox-amo, edge-addons]
        default: all

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release metadata and versions
        shell: pwsh
        run: |
          $versions = @(
            (Get-Content manifest.json -Raw | ConvertFrom-Json).version
            (Get-Content manifest.firefox.json -Raw | ConvertFrom-Json).version
            (Get-Content store-assets/release-metadata.json -Raw | ConvertFrom-Json).version
          )
          if (($versions | Select-Object -Unique).Count -ne 1) {
            throw "Manifest and release metadata versions differ: $($versions -join ', ')"
          }
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}".TrimStart("v")
            if ($versions[0] -ne $tag) {
              throw "Tag $tag does not match release version $($versions[0])"
            }
          }
  chrome-web-store:
    needs: validate
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'chrome-web-store'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build packages
        shell: pwsh
        run: ./build.ps1

      - name: Upload and publish
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          ACCESS_TOKEN=$(curl -sf -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token | jq -r .access_token)
          curl -sf -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -X PUT -T dist/untabit-chromium.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID"
          curl -sf -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" -H "Content-Length: 0" \
            -X POST \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID/publish"

  firefox-amo:
    needs: validate
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'firefox-amo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build packages
        shell: pwsh
        run: ./build.ps1

      - name: Sign and submit to AMO
        run: |
          jq '{version: {release_notes: .release_notes, approval_notes: .approval_notes}}' store-assets/release-metadata.json > /tmp/amo-metadata.json
          npx --yes web-ext sign --source-dir dist/firefox --channel listed --amo-metadata /tmp/amo-metadata.json --api-key "${{ secrets.AMO_JWT_ISSUER }}" --api-secret "${{ secrets.AMO_JWT_SECRET }}"

  edge-addons:
    needs: validate
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'edge-addons'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build packages
        shell: pwsh
        run: ./build.ps1

      - name: Upload and publish
        env:
          PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          set -euo pipefail

          BASE="https://api.addons.microsoftedge.microsoft.com/v1/products/$PRODUCT_ID/submissions"
          AUTH=(-H "Authorization: ApiKey $API_KEY" -H "X-ClientID: $CLIENT_ID")

          wait_for_operation() {
            local url="$1"
            local label="$2"
            local response status
            for _ in $(seq 1 30); do
              response=$(curl -fsS "${AUTH[@]}" "$url")
              status=$(jq -r '.status // empty' <<<"$response")
              echo "$label status: $status"
              case "$status" in
                Succeeded) return 0 ;;
                Failed)
                  jq . <<<"$response"
                  return 1
                  ;;
              esac
              sleep 10
            done
            echo "$label timed out"
            return 1
          }

          headers=$(mktemp)
          body=$(mktemp)
          trap 'rm -f "$headers" "$body"' EXIT

          http_code=$(curl -sS -o "$body" -D "$headers" -w "%{http_code}" \
            -X POST "${AUTH[@]}" -H "Content-Type: application/zip" \
            -T dist/untabit-chromium.zip "$BASE/draft/package")
          if [ "$http_code" != "202" ]; then
            echo "Edge package upload failed with HTTP $http_code"
            cat "$body"
            exit 1
          fi

          operation_id=$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { gsub("\r", "", $2); print $2 }' "$headers")
          [ -n "$operation_id" ] || { echo "Edge upload response had no Location header"; exit 1; }
          echo "package upload operation: $operation_id"
          wait_for_operation "$BASE/draft/package/operations/$operation_id" "upload"

          : > "$headers"
          : > "$body"
          http_code=$(curl -sS -o "$body" -D "$headers" -w "%{http_code}" \
            -X POST "${AUTH[@]}" -H "Content-Type: text/plain" \
            --data-binary "$(jq -r '.release_notes["en-US"]' store-assets/release-metadata.json)" "$BASE")
          if [ "$http_code" != "202" ]; then
            echo "Edge submission failed with HTTP $http_code"
            cat "$body"
            exit 1
          fi

          operation_id=$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { gsub("\r", "", $2); print $2 }' "$headers")
          [ -n "$operation_id" ] || { echo "Edge publish response had no Location header"; exit 1; }
          echo "publish operation: $operation_id"
          wait_for_operation "$BASE/operations/$operation_id" "publish"
          echo "submitted for review"
